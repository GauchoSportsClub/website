<!-- Started with a little Chat, then fully tweaked it myself to make it the proper globe style -->
<!-- fonting help: https://stackoverflow.com/a/53674218 -->

<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 500"
     width="500"
     height="500">

  <defs>
    <style type="text/css">
      @font-face {
      font-family: "Lobster";
      font-style: normal;
      font-weight: 400;
      src: url("data:application/font-woff;charset=utf-8;base64,") format("woff2");
      unicode-range: U+20, U+41, U+47, U+53, U+61, U+63, U+68-69, U+6c, U+6e-70, U+72-75, U+79;
      }
      
    </style>
  </defs>

  <!-- Circular text path -->
  <path id="textCircle"
	d="M 250,65
	   A 185,185 0 1 1 249.99,65"
	fill="none"/>

  <!-- Blue circular logo background -->
  <circle cx="250"
	  cy="250"
	  r="250"
	  fill="#1b4a7f"/>

  <!-- Gold globe linework -->
  <g fill="none"
     stroke="#ca9841"
     stroke-width="2"
     opacity="0.95">

    <circle cx="250" cy="250" r="155"/>

    <ellipse cx="250" cy="250" rx="31" ry="155" transform="rotate(65 250 250)"/>
    <ellipse cx="250" cy="250" rx="31" ry="155" transform="rotate(45 250 250)"/>
    <ellipse cx="250" cy="250" rx="81" ry="155" transform="rotate(85 250 250)"/>
    <ellipse cx="250" cy="250" rx="81" ry="155" transform="rotate(25 250 250)"/>
    <ellipse cx="250" cy="250" rx="114" ry="155" transform="rotate(120 250 250)"/>
    <ellipse cx="250" cy="250" rx="114" ry="155" transform="rotate(-10 250 250)"/>

    <ellipse cx="250" cy="250" rx="81" ry="50" transform="rotate(55 250 250) translate(0 105)"/>
    <ellipse cx="250" cy="250" rx="81" ry="50" transform="rotate(55 250 250) translate(0 -105)"/>
    <ellipse cx="250" cy="250" rx="136" ry="81" transform="rotate(55 250 250) translate(0 -58)"/>
    <ellipse cx="250" cy="250" rx="136" ry="81" transform="rotate(55 250 250) translate(0 58)"/>
    <ellipse cx="250" cy="250" rx="155" ry="84" transform="rotate(55 250 250) translate(0 0)"/>

    <g fill="#ffbd59">
      <circle cx="250" cy="131" r="3" transform="rotate(55 250 250)"/>
      <circle cx="250" cy="369" r="3" transform="rotate(55 250 250)"/>
    </g>
  </g>

  <text fill="white"
	font-family="Lobster"
	font-size="64"
	font-weight="900"
	letter-spacing="2"
	text-anchor="middle"
	textLength="1130"
	lengthAdjust="spacingAndGlyphs">
    <textPath xlink:href="#textCircle"
	      startOffset="50%">
      Gaucho Sports Analytics
    </textPath>
  </text>
</svg>
